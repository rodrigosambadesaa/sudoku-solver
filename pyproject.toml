[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-sudoku-solver"
version = "1.0.0"
description = "Dependency-free Sudoku solver for arbitrary NxN grids; enumerate every valid solution"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
sudoku-solver = "sudoku_solver.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
